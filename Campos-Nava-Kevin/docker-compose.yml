
services:

  sandbox:
    build:
      context: ./estatico
      dockerfile: user_data/sandbox/Dockerfile
    container_name: lab-sandbox
    networks:
      - lab-sandbox
    # Sin volumen compartido: el engine envía cada muestra por SFTP sobre SSH.
    volumes:
      - ./lab_keys/id_rsa.pub:/tmp/authorized_keys:ro
    healthcheck:
      test: ["CMD-SHELL", "pgrep sshd >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: lab-db
    networks:
      - lab-frontend
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-lab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lab}
      POSTGRES_DB:       ${POSTGRES_DB:-lab}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./base_de_datos/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lab}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  engine:
    build:
      context: .
      dockerfile: estatico/user_data/motor/Dockerfile
    container_name: lab-engine
    networks:
      - lab-frontend
      - lab-sandbox
    ports:
      - "${ENGINE_PORT:-8001}:8001"
    volumes:
      - ./lab_keys/id_rsa:/keys/id_rsa:ro
      - samples:/samples
    environment:
      SANDBOX_HOST: sandbox
      SANDBOX_PORT: 22
      SANDBOX_USER: root
      KEY_PATH:     /keys/id_rsa
      SAMPLES_DIR:  /samples
      DATABASE_URL: postgresql://${POSTGRES_USER:-lab}:${POSTGRES_PASSWORD:-lab}@db:5432/${POSTGRES_DB:-lab}
    depends_on:
      sandbox:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./web
    container_name: lab-web
    networks:
      - lab-frontend
    ports:
      - "${WEB_PORT:-8000}:8000"
    environment:
      ENGINE_URL: http://engine:8001
    depends_on:
      - engine
    restart: unless-stopped

networks:
  lab-frontend:
    driver: bridge
  lab-sandbox:
    driver: bridge
    internal: true   # sandbox sin salida a internet ni al host

volumes:
  samples:
  db-data:

# nginx del contenedor `web`: sirve el SPA (Vite build) y hace de proxy único
# hacia el motor estático y el servicio dinámico del host. Así el navegador solo
# habla con un origen (mismo puerto) y no dependemos de CORS.
server {
    listen 8000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Subidas de muestras / volcados: sin límite estrecho.
    client_max_body_size 256m;

    # Motor estático (FastAPI en el contenedor `engine`).
    location /api/ {
        proxy_pass http://engine:8001/;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }

    # Servicio dinámico (corre en el HOST, fuera de Docker). Prefijo /dynapi/
    # a propósito distinto de la ruta del SPA /dynamic, para que no colisionen.
    location /dynapi/ {
        proxy_pass http://host.docker.internal:8002/;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }

    # SPA: cualquier ruta cae en index.html (react-router en el cliente).
    location / {
        try_files $uri $uri/ /index.html;
    }
}

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "compartido"
version = "0.1.0"
description = "Malware Lab — biblioteca compartida (conexión SSH/SFTP y configuración)"
requires-python = ">=3.10"
dependencies = [
    "paramiko>=3.0",
]

# Extra del lado dinámico (host): el servicio HTTP que la web llama para disparar
# detonaciones (FastAPI). Se instala en el host con `pip install -e ".[dinamico]"`.
[project.optional-dependencies]
dinamico = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
]

# compartido/ y sus subpaquetes son namespace packages (PEP 420): no hay
# archivos __init__.py, así que se descubren con namespaces = true.
[tool.setuptools.packages.find]
include = ["compartido*"]
namespaces = true

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Historial — Malware Lab</title>
    <style>
        body { font-family: monospace; max-width: 1100px; margin: 60px auto; padding: 0 20px; background: #1a1a1a; color: #e0e0e0; }
        h1 { color: #00ff88; }
        a { color: #00ff88; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 8px 12px; border: 1px solid #333; text-align: left; vertical-align: top; }
        th { color: #00aaff; }
        code { color: #ffcc00; word-break: break-all; }
        .err { color: #ff4444; background: #2a0000; padding: 10px; }
    </style>
</head>
<body>
    <h1>Historial de muestras</h1>
    <a href="/">← Subir nueva muestra</a>

    {% if error %}
        <p class="err">Error: {{ error }}</p>
    {% endif %}

    <table>
        <tr><th>SHA256</th><th>Archivo</th><th>Tamaño</th><th>Subida</th></tr>
        {% for s in samples %}
        <tr>
            <td><code>{{ s.sha256 }}</code></td>
            <td>{{ s.filename }}</td>
            <td>{{ s.size }} B</td>
            <td>{{ s.uploaded_at }}</td>
        </tr>
        {% empty %}
        <tr><td colspan="4">Sin muestras aún.</td></tr>
        {% endfor %}
    </table>
</body>
</html>

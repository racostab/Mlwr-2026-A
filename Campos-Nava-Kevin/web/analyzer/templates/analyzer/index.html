<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malware Lab</title>
    <style>
        body { font-family: monospace; max-width: 700px; margin: 60px auto; padding: 0 20px; background: #1a1a1a; color: #e0e0e0; }
        h1 { color: #00ff88; }
        label { display: block; margin-top: 16px; color: #aaa; }
        input[type=file], input[type=number] { background: #2a2a2a; border: 1px solid #444; color: #e0e0e0; padding: 8px; width: 100%; box-sizing: border-box; }
        button { margin-top: 20px; padding: 10px 24px; background: #00ff88; color: #000; border: none; cursor: pointer; font-family: monospace; font-size: 1rem; font-weight: bold; }
        button:hover { background: #00cc6a; }
        .error { color: #ff4444; background: #2a0000; padding: 10px; margin-top: 16px; }
    </style>
</head>
<body>
    <h1>Malware Lab</h1>
    <p>Análisis estático de binarios — <a href="/history/" style="color:#00aaff">ver historial</a></p>

    {% if error %}
        <div class="error">Error: {{ error }}</div>
    {% endif %}

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <label>Archivo a analizar</label>
        <input type="file" name="file" required>

        <label>Longitud mínima para strings</label>
        <input type="number" name="min_len" value="4" min="1" max="100">

        <button type="submit">Analizar</button>
    </form>
</body>
</html>
